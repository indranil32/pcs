name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Azure after the checks pass
        type: boolean
        default: true

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Typecheck, test, build portal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: pcs }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pcs
      DATABASE_URL: postgres://pcs_app:pcs_app@localhost:5432/pcs
      APP_DB_PASSWORD: pcs_app
      JWT_SECRET: ci-run-${{ github.run_id }}-${{ github.run_attempt }}-throwaway
      WORKERS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Integration tests (real PostgreSQL, row-level security on)
        run: npm test
      - name: Build portal
        run: npm run build

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - name: Dependency vulnerabilities (npm audit, runtime deps)
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Filesystem and IaC scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: node_modules
      - name: Bicep build
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

  build:
    name: Build and scan image
    needs: [test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (local)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Container boots and passes smoke tests
        run: |
          docker network create pcsnet
          docker run -d --name db --network pcsnet -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=pcs postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U postgres && break; sleep 2; done
          docker run -d --name pcs --network pcsnet -p 4000:4000 \
            -e ADMIN_DATABASE_URL=postgres://postgres:postgres@db:5432/pcs -e DATABASE_URL=postgres://pcs_app:pcs_app@db:5432/pcs \
            -e APP_DB_PASSWORD=pcs_app -e JWT_SECRET=$(openssl rand -hex 32) -e SEED_DEMO_DATA=true \
            $IMAGE:${{ github.sha }}
          for i in $(seq 1 60); do curl -fsS localhost:4000/health && break; sleep 3; done
          BASE_URL=http://localhost:4000 node apps/api/test/smoke.mjs || (docker logs pcs; exit 1)
      - name: Push (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  deploy:
    name: Deploy to Azure and smoke test
    timeout-minutes: 40
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-latest
    environment: azure-dev
    permissions:
      id-token: write
      contents: read
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      ESG_RG: ${{ vars.ESG_RESOURCE_GROUP }}
    steps:
      - name: Check Azure configuration
        id: cfg
        run: |
          if [ -z "${{ vars.AZURE_CLIENT_ID }}" ] || [ -z "$RG" ] || [ -z "$ESG_RG" ]; then
            echo "::warning::Set AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_RESOURCE_GROUP and ESG_RESOURCE_GROUP on the azure-dev environment (see infra/github-oidc-setup.sh). Skipping deployment."
            echo "ready=false" >> $GITHUB_OUTPUT
          else
            echo "ready=true" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@v7
        if: steps.cfg.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.cfg.outputs.ready == 'true'
        with: { node-version: 22 }
      - uses: azure/login@v3
        if: steps.cfg.outputs.ready == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Shared with ESG: its Container Apps environment and PostgreSQL server (PCS gets its own database and roles).
      - name: Discover shared ESG resources
        if: steps.cfg.outputs.ready == 'true'
        run: |
          PG=$(az postgres flexible-server list -g "$ESG_RG" --query "[0].name" -o tsv)
          PG_HOST=$(az postgres flexible-server show -g "$ESG_RG" -n "$PG" --query fullyQualifiedDomainName -o tsv)
          ENV_ID=$(az containerapp env list -g "$ESG_RG" --query "[0].id" -o tsv)
          ESG_APP=$(az containerapp list -g "$ESG_RG" --query "[0].name" -o tsv)
          [ -n "$PG" ] && [ -n "$ENV_ID" ] && [ -n "$ESG_APP" ] || { echo "::error::ESG server/environment/app not found in $ESG_RG"; exit 1; }
          echo "PG=$PG" >> $GITHUB_ENV; echo "PG_HOST=$PG_HOST" >> $GITHUB_ENV; echo "ENV_ID=$ENV_ID" >> $GITHUB_ENV; echo "ESG_APP=$ESG_APP" >> $GITHUB_ENV
          echo "Shared server $PG_HOST, environment $(basename $ENV_ID)"

      # Passwords live only in the PCS container app's secrets: generated on the first deploy, read back afterwards.
      - name: Load or generate PCS secrets
        if: steps.cfg.outputs.ready == 'true'
        env:
          DEMO_OVERRIDE: ${{ secrets.PCS_DEMO_PASSWORD }}
        run: |
          APP=$(az containerapp list -g "$RG" --query "[?starts_with(name,'ca-pcs')].name | [0]" -o tsv)
          sec() { az containerapp secret show -g "$RG" -n "$APP" --secret-name "$1" --query value -o tsv 2>/dev/null || true; }
          if [ -n "$APP" ]; then
            echo "PREV=$(az containerapp show -g "$RG" -n "$APP" --query 'properties.template.containers[0].image' -o tsv)" >> $GITHUB_ENV
            OWNER=$(sec db-admin-password); APPPW=$(sec app-db-password); JWT=$(sec jwt-secret); DEMO=$(sec demo-password)
          fi
          OWNER=${OWNER:-$(openssl rand -hex 24)}; APPPW=${APPPW:-$(openssl rand -hex 24)}; JWT=${JWT:-$(openssl rand -hex 32)}
          DEMO=${DEMO_OVERRIDE:-${DEMO:-Pcs-$(openssl rand -hex 6)}}
          for v in "$OWNER" "$APPPW" "$JWT" "$DEMO"; do echo "::add-mask::$v"; done
          { echo "PCS_DB_ADMIN_PASSWORD=$OWNER"; echo "PCS_APP_DB_PASSWORD=$APPPW"; echo "PCS_JWT_SECRET=$JWT"; echo "PCS_DEMO_PASSWORD=$DEMO"; } >> $GITHUB_ENV

      - name: Create pcs database and roles on the shared server (idempotent)
        if: steps.cfg.outputs.ready == 'true'
        run: |
          ESG_URL=$(az containerapp secret show -g "$ESG_RG" -n "$ESG_APP" --secret-name database-url --query value -o tsv | sed -E 's#^postgres(ql)?(\+[a-z0-9]+)?://#postgresql://#')
          echo "::add-mask::$ESG_URL"
          case "$ESG_URL" in *sslmode=*) ;; *\?*) ESG_URL="$ESG_URL&sslmode=require" ;; *) ESG_URL="$ESG_URL?sslmode=require" ;; esac
          IP=$(curl -fsS https://api.ipify.org)
          RULE=gh-pcs-${{ github.run_id }}
          az postgres flexible-server firewall-rule create -g "$ESG_RG" -n "$PG" -r "$RULE" --start-ip-address "$IP" --end-ip-address "$IP" -o none
          trap 'az postgres flexible-server firewall-rule delete -g "$ESG_RG" -n "$PG" -r "$RULE" --yes -o none' EXIT
          psql "$ESG_URL" -v ON_ERROR_STOP=1 -q -v ownerpw="$PCS_DB_ADMIN_PASSWORD" -v apppw="$PCS_APP_DB_PASSWORD" <<'SQL'
          SELECT format('CREATE ROLE pcs_owner LOGIN CREATEROLE PASSWORD %L', :'ownerpw') WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'pcs_owner') \gexec
          SELECT format('ALTER ROLE pcs_owner WITH LOGIN CREATEROLE PASSWORD %L', :'ownerpw') \gexec
          SELECT format('CREATE ROLE pcs_app LOGIN PASSWORD %L', :'apppw') WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'pcs_app') \gexec
          SELECT format('ALTER ROLE pcs_app WITH LOGIN NOCREATEROLE PASSWORD %L', :'apppw') \gexec
          SELECT format('GRANT pcs_owner TO %I', current_user) \gexec
          SELECT 'CREATE DATABASE pcs OWNER pcs_owner' WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'pcs') \gexec
          REVOKE CONNECT ON DATABASE pcs FROM PUBLIC;
          GRANT CONNECT ON DATABASE pcs TO pcs_owner, pcs_app;
          SQL
          echo "pcs database ready on $PG_HOST"

      - name: Deploy infrastructure and new image (Bicep)
        if: steps.cfg.outputs.ready == 'true'
        env:
          PCS_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
          PCS_EXISTING_ENV_ID: ${{ env.ENV_ID }}
          PCS_EXISTING_PG_HOST: ${{ env.PG_HOST }}
          PCS_DB_ADMIN_USER: pcs_owner
        run: |
          OUT=$(az deployment group create -g "$RG" -n "pcs-${{ github.run_number }}" -f infra/main.bicep -p infra/dev.bicepparam --query properties.outputs -o json)
          echo "$OUT"
          echo "APP=$(echo "$OUT" | jq -r .appName.value)" >> $GITHUB_ENV
          echo "APP_URL=$(echo "$OUT" | jq -r .appUrl.value)" >> $GITHUB_ENV
      - name: Wait for healthy
        if: steps.cfg.outputs.ready == 'true'
        run: |
          for i in $(seq 1 60); do
            s=$(curl -fsS "$APP_URL/health" 2>/dev/null | jq -r .status 2>/dev/null || true)
            echo "health: ${s:-down}"; [ "$s" = "ok" ] && exit 0; sleep 10
          done
          az containerapp logs show -g "$RG" -n "$APP" --tail 80 --type console || true
          exit 1
      - name: Smoke tests against Azure
        if: steps.cfg.outputs.ready == 'true'
        env:
          BASE_URL: ${{ env.APP_URL }}
          DEMO_PASSWORD: ${{ env.PCS_DEMO_PASSWORD }}
        run: node apps/api/test/smoke.mjs
      - name: Summary
        if: steps.cfg.outputs.ready == 'true'
        run: |
          echo "### Deployed ${{ github.sha }} → $APP_URL" >> $GITHUB_STEP_SUMMARY
          echo "Demo password: \`az containerapp secret show -g $RG -n $APP --secret-name demo-password --query value -o tsv\`" >> $GITHUB_STEP_SUMMARY
      - name: Roll back on failure
        if: failure() && env.PREV != '' && env.APP != ''
        run: |
          echo "Rolling back to $PREV"
          az containerapp update -g "$RG" -n "$APP" --image "$PREV" -o none
