# Local stack: docker compose up --build  →  http://localhost:4000
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: pcs }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 5s, retries: 10 }
    volumes: [pcsdb:/var/lib/postgresql/data]
  pcs:
    build: .
    depends_on: { db: { condition: service_healthy } }
    ports: ["4000:4000"]
    environment:
      ADMIN_DATABASE_URL: postgres://postgres:postgres@db:5432/pcs
      DATABASE_URL: postgres://pcs_app:pcs_app@db:5432/pcs
      APP_DB_PASSWORD: pcs_app
      JWT_SECRET: local-dev-secret-change-me-0123456789
      SEED_DEMO_DATA: "true"
      DEMO_PASSWORD: PcsDemo!2026
volumes:
  pcsdb:
